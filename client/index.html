<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="voice-call.js"></script>
    <script src="websocket-client.js"></script>
    <title>Chatting Application</title>
</head>
<body>
    <h1>Chatting application</h1>
    <h2 id="status">Status: Offline</h2>
    <div id="online">
        <div id="update-name">
            <input id="name-input" type="text">
            <button onclick="updateName()">Update name</button>
        </div>
        <div id="callers">
            
        </div>
        <div id="users">
            <h4>Select a user and chat with it</h4>
            <ul id="users-list">

            </ul>
        </div>
        <div id="calling-user">
            <h4>Waiting for user to respond</h4>
            <button onclick="cancelCallingUser()">Cancel</button>
        </div>
        <div id="in-call">
            <button onclick="endCall()">Leave</button>
        </div>
    </div>
</body>
</html>
